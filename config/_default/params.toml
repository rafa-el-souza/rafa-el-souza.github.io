# Settings shared by both languages. Anything that differs per language lives in
# languages.<lang>.toml instead.

# Congo's own scheme, deliberately a throwaway: the palette is chosen in the
# creative pass, not here.
colorScheme = "congo"

# Client-side search over the JSON index declared in hugo.toml. Fuse.js ships
# with the theme, so no script is fetched from anywhere else.
enableSearch = true

[homepage]
  # The built-in profile layout: name, headline, links, then the page body.
  layout = "profile"
  showRecent = false

[article]
  # Posts are the only dated content here. A date on About, on a project card or
  # on a living reference page is the day the file happened to be written, which
  # says nothing true about the thing itself and ages badly. The posts section
  # turns it back on for its own pages.
  showDate = false
  showAuthor = false
  showBreadcrumbs = true
  showReadingTime = false
  showTaxonomies = true
  showWordCount = false

[list]
  showSummary = true
  showTableOfContents = false

[footer]
  showScrollToTop = true
