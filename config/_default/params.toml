# Settings shared by both languages. Anything that differs per language lives in
# languages.<lang>.toml instead.

# Congo's own scheme, deliberately a throwaway: the palette is chosen in the
# creative pass, not here.
colorScheme = "congo"

# Client-side search over the JSON index declared in hugo.toml. Fuse.js ships
# with the theme, so no script is fetched from anywhere else.
enableSearch = true

[header]
  # The theme's default header wraps the menu into a column on narrow screens,
  # which on a phone pushes the page title below six stacked rows before any
  # content starts. "hybrid" keeps the full menu on wide screens and collapses
  # it behind a button below the theme's 640px breakpoint.
  layout = "hybrid"

[homepage]
  # The built-in profile layout: name, headline, links, then the page body.
  layout = "profile"
  showRecent = false

[article]
  # Posts are the only dated content here. A date on About, on a project card or
  # on a living reference page is the day the file happened to be written, which
  # says nothing true about the thing itself and ages badly. The posts section
  # turns it back on for its own pages.
  showDate = false
  showAuthor = false
  showBreadcrumbs = true
  showReadingTime = false
  showTaxonomies = true
  showWordCount = false

[list]
  showSummary = true
  showTableOfContents = false
  # Tags take the line the creation date used to occupy, with something true in
  # it. Pages without tags render nothing, so this only shows up where there is
  # something to show.
  showTaxonomies = true

[footer]
  showScrollToTop = true
