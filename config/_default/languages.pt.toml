# Portuguese - a full mirror of the English tree, same paths under /pt/.
# The key is `pt` so URLs and hreflang read as plain Portuguese, while `locale`
# carries the region that reaches <html lang>. It also decides which i18n file
# applies: Hugo resolves translations by locale, so the strings live in
# i18n/pt-BR.yaml - naming that file after the language key would leave it
# silently unused.
locale = "pt-BR"
label = "Português"
direction = "ltr"
weight = 2

contentDir = "content/pt"

title = "Rafael Souza"

[params]
  dateFormat = "2 de January de 2006"
  mainSections = ["posts"]
  description = "Uma investigação em público sobre o que significa rodar agentes de IA com segurança."

[params.author]
  name = "Rafael Souza"
  headline = "O que significa rodar agentes de IA com segurança?"
  links = [
    { github = "https://github.com/rafa-el-souza" },
    { linkedin = "https://www.linkedin.com/in/rafa-el-souza" },
  ]
