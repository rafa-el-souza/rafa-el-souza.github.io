baseURL = 'https://rafa-el-souza.github.io/'
theme = 'congo'

# English is the default language and still lives under its own path, so both
# languages are addressed the same way: /en/... and /pt/.... Hugo puts a
# redirect at the root. Per-language title, locale and author details live in
# config/_default/languages.<lang>.toml; shared settings in params.toml.
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

# Portuguese titles and tags carry accents; without this they reach the URL and
# get percent-encoded, which is unreadable the moment a link is shared.
removePathAccents = true

# Hugo emits no robots.txt unless asked; the theme supplies the layout.
enableRobotsTXT = true

# Take each page's last-modified date from the last commit that touched it,
# rather than from a frontmatter field somebody has to remember to bump or from
# a file timestamp, which a fresh checkout resets to the moment it was cloned.
# The lab pages are the ones that need it: a living document is only worth
# trusting if the reader can see when it was last corrected.
#
# This makes the build read git history, so both workflows check out with
# fetch-depth: 0. A shallow clone would date every page to the same commit.
enableGitInfo = true

# The JSON output is the search index. Congo's search reads it at runtime and
# runs entirely in the browser, so nothing here reaches a third party.
[outputs]
  home = ["HTML", "RSS", "JSON"]
