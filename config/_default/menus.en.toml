# Main navigation, English.
# Order is set by weight, not alphabetically. Lab comes first because the living
# docs are the spine of the site; the rest follows.
# Keep this in step with menus.pt.toml - same entries, same weights.

[[main]]
  name = "Lab"
  pageRef = "lab"
  weight = 10

[[main]]
  name = "Projects"
  pageRef = "projects"
  weight = 20

[[main]]
  name = "Posts"
  pageRef = "posts"
  weight = 30

[[main]]
  name = "About"
  pageRef = "about"
  weight = 40

# Search and the language switcher. Congo renders both from these entries alone;
# search is an overlay, so it needs no page of its own.
[[main]]
  identifier = "search"
  weight = 90
  [main.params]
    action = "search"

[[main]]
  identifier = "locale"
  weight = 100
  [main.params]
    action = "locale"
