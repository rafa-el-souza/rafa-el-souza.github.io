# Portuguese theme strings.
#
# Congo ships pt-BR.yaml and pt-PT.yaml but no plain pt.yaml, and Hugo looks up
# translations by the language key. This site uses the key `pt`, so the strings
# have to live here. Started as a copy of themes/congo/i18n/pt-BR.yaml
# (Congo, MIT); when the theme adds strings, missing keys here fall back to the
# default language.
#
# The upstream file left several strings commented out or in English, which is
# how a "Portuguese" page ends up with an English search box. Everything this
# site actually renders is filled in below. Anything still commented is for a
# feature that is switched off here; uncomment it when the feature is switched
# on, rather than leaving the reader to find it in English.

article:
  anchor_label: "Âncora"
  date: "{{ .Date }}"
  date_updated: "Atualizado: {{ .Date }}"
  draft: "Rascunho"
  edit_title: "Editar conteúdo"
  reading_time:
    one: "{{ .Count }} minuto"
    other: "{{ .Count }} minutos"
  reading_time_title: "Tempo de leitura"
  table_of_contents: "Índice"
  word_count:
    one: "{{ .Count }} palavra"
    other: "{{ .Count }} palavras"

